name: CI Pipeline — Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ══════════════════════════════════════════
  # CI: Check Backend builds correctly
  # ══════════════════════════════════════════
  check-backend:
    name: Check Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend dependencies
        run: |
          cd backend
          npm install

      - name: Check Backend starts
        run: |
          cd backend
          echo "✅ Backend dependencies installed successfully"

  # ══════════════════════════════════════════
  # CI: Check Frontend builds correctly
  # ══════════════════════════════════════════
  check-frontend:
    name: Check Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Build Success
        run: echo "✅ Frontend built successfully"

  # ══════════════════════════════════════════
  # CD: Trigger Render Deploy
  # ══════════════════════════════════════════
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: [check-backend, check-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Backend to Render
        run: |
          curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          echo "✅ Backend deployment triggered!"

      - name: Deploy Frontend to Render
        run: |
          curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          echo "✅ Frontend deployment triggered!"